# Pre-commit hooks — https://pre-commit.com
#
# Instalar (una vez por clon):   uv run pre-commit install
# Ejecutar sobre todo el repo:   uv run pre-commit run --all-files
# Herramientas: higiene de archivos + Ruff + uv-lock.

default_language_version:
  python: python3.11

minimum_pre_commit_version: "3.7.0"
fail_fast: false

# Material preservado sin cambios (hashes en SHA256SUMS.json / SOURCE_PROVENANCE.json).
exclude: >-
  ^(AI_ASSISTANT_PROMPT\.(md|txt)|mathematical_checks/|historical_reference/|manuscript/(cas-common\.sty|cas-sc\.cls|cas-model2-names\.bst|elsarticle-num\.bst)|SHA256SUMS\.json|SOURCE_PROVENANCE\.json|verification_results\.json)

repos:
  # --- Higiene general de archivos ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: mixed-line-ending
      - id: detect-private-key

  # --- Ruff: lint + formato (Astral) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  # --- Notebooks: elimina salidas y metadatos antes de commitear (proyecto-abel) ---
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout

  # --- uv: mantiene uv.lock sincronizado (Astral) ---
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.2
    hooks:
      - id: uv-lock
